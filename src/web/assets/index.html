<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>treex</title>
<link rel="icon" href="/favicon.svg">
<style id="hues"></style>
<style>
  :root {
    /* --fs sizes the tree and file contents only; the nav keeps --ui so the
       controls do not shrink out from under you while you adjust it. */
    --fs: 10px; --ui: 13px;
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --guide: #d1d9e0;
    --sel: #ddf4ff; --read: #efe3ff; --dir: #0969da; --link: #1b7c83; --bar: #f6f8fa; --border: #d1d9e0;
    --ok: #1a7f37; --off: #cf222e; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --guide: #2a313c;
      --sel: #163356; --read: #2d1f47; --dir: #4493f8; --link: #39c5cf; --bar: #151b23; --border: #2a313c;
      --ok: #3fb950; --off: #f85149; --warn: #d29922;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font: var(--ui)/1.35 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
    -webkit-text-size-adjust: 100%;
  }

  /* Pinned by being a non-shrinking flex child rather than position:fixed —
     iOS Safari moves fixed elements around while the address bar collapses. */
  .nav {
    flex-shrink: 0; background: var(--bar); border-bottom: 1px solid var(--border);
    padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 6px; min-width: 0;
  }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex-shrink: 0; }
  #dot.on { background: var(--ok); }
  .title {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--muted);
  }
  /* rtl so a long path is clipped at the front — the tail is the useful end.
     The text itself is wrapped in an LTR embedding, or the leading "/" would
     be reordered to the far side as a neutral character. */
  #root { direction: rtl; text-align: left; }
  #vname { color: var(--fg); font-weight: 600; direction: ltr; }
  #vmeta { color: var(--muted); font-size: .85em; flex-shrink: 0; white-space: nowrap; }

  button {
    font: inherit; font-size: .85em; color: var(--fg); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 0 9px; min-height: 30px; cursor: pointer; white-space: nowrap;
    -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--sel); border-color: var(--dir); }

  /* − 14 + as one unit, always last in the nav. */
  .fs { display: flex; align-items: center; flex-shrink: 0; }
  .fs button { padding: 0 8px; }
  .fs button:first-child { border-radius: 6px 0 0 6px; }
  .fs button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .fs span {
    min-width: 3em; text-align: center; color: var(--muted); font-size: .85em;
    border: 1px solid var(--border); border-left: 0; border-right: 0;
    line-height: 30px; height: 30px;
  }

  /* Tree on the left, file on the right — the file is what is being read, so
     the tree is a sidebar rather than half the window. */
  #panes { flex: 1; display: flex; min-height: 0; min-width: 0; }
  main { flex: 1; min-width: 0; overflow: auto; padding: 4px 0 0;
         -webkit-overflow-scrolling: touch;
         font-size: var(--fs); overscroll-behavior: contain; }
  #panes.split main {
    flex: 0 0 25%; min-width: 170px; max-width: 380px;
    border-right: 1px solid var(--border);
  }
  /* Folded away by clicking the file's name. */
  #panes.split.aside main { display: none; }
  /* A phone has room for one thing at a time, which is what this page is for.
     The file takes the window and `←` brings the tree back. */
  @media (max-width: 700px) {
    #panes.split main { display: none; }
  }
  /* The rows are absolutely positioned inside a spacer of the full height, so
     only the ones on screen ever exist as elements. */
  #spacer { position: relative; }
  .row {
    position: absolute; left: 0; right: 0;
    display: flex; align-items: center; gap: 2px;
    padding: 0 12px; height: 2.2em; cursor: pointer;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .row:hover { background: color-mix(in srgb, var(--sel) 45%, transparent); }
  .row.sel { background: var(--sel); }
  .row.viewing { background: var(--read); box-shadow: inset 3px 0 0 var(--dir); }
  .guide { color: var(--guide); white-space: pre; flex-shrink: 0; }
  .tw { width: 1.2em; flex-shrink: 0; color: var(--muted); text-align: center; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kind-d > .name { color: var(--dir); font-weight: 600; }
  .kind-s > .name, .kind-p > .name,
  .kind-c > .name, .kind-b > .name { color: var(--warn); }
  .kind-broken > .name { color: var(--off); text-decoration: line-through; }
  /* What git ignores, and .git itself. Dimmed as a whole: the twistie and the
     guides are as uninteresting as the name. */
  .row.ignored { opacity: .45; }
  .link > .name { font-style: italic; }
  .omitted { color: var(--warn); font-size: .85em; margin-left: .7em; white-space: nowrap; }

  #viewer { flex: 1; min-width: 0; background: var(--bg);
            display: flex; flex-direction: column; }
  #viewer[hidden] { display: none; }
  #vbody { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; font-size: var(--fs);
           overscroll-behavior: contain; }
  /* stretch, not flex-start: otherwise the gutter's background stops where its
     numbers stop and the rest of the column shows through as blank. */
  .code { display: flex; align-items: stretch; min-width: min-content; }
  .code pre { margin: 0; font: inherit; tab-size: 4; padding: 10px 0; line-height: 1.4; }
  /* Sticky so the gutter survives horizontal scrolling of long lines. */
  #gutter {
    position: sticky; left: 0; z-index: 1; flex-shrink: 0;
    background: var(--bar); border-right: 1px solid var(--border);
    color: var(--muted); text-align: right; padding-inline: 8px;
    user-select: none; -webkit-user-select: none;
  }
  #gutter[hidden] { display: none; }
  /* On a painted file the gutter cannot keep the page's own bar color: the
     backdrop next to it came from the theme, not from the page. */
  #vbody.painted #gutter { background: rgb(128 128 128 / .1); border-color: rgb(128 128 128 / .25);
                           color: inherit; opacity: .5; }
  #text { padding-inline: 10px; }
  #vbody.wrap .code { min-width: 0; }
  #vbody.wrap #text { white-space: pre-wrap; word-break: break-word; }
  /* A two-column gutter cannot follow wrapped lines, so it steps aside. */
  #vbody.wrap #gutter { display: none; }
  .notice { color: var(--warn); padding: 24px 12px; text-align: center;
            line-height: 1.7; white-space: pre-line; }

  #scroll {
    position: absolute; right: 12px; z-index: 20;
    bottom: calc(12px + env(safe-area-inset-bottom));
    /* The version line is wider than the buttons; without this it would drag
       them off the right margin they are aligned to. */
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  #scroll button, #scroll a {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; padding: 0; border-radius: 50%;
    font-size: 1.1em; opacity: .85; color: var(--fg); text-decoration: none;
    border: 1px solid var(--border); background: var(--bar);
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  #scroll a[hidden] { display: none; }
  #version { font-size: .7em; color: var(--muted); }
</style>
</head>
<body>
<div class="nav">
  <span id="dot"></span>
  <span class="title" id="root">connecting…</span>
  <button id="fold">expand</button>
  <button id="hidden" title="hide dotfiles">hide .*</button>
  <span class="fs"><button id="fsdown">−</button><span id="fsnow"></span><button id="fsup">+</button></span>
</div>

<div id="panes">
<main id="tree"><div id="spacer"></div></main>

<div id="viewer" hidden>
  <div class="nav">
    <button id="vclose">←</button>
    <button id="vside" title="show or hide the tree">«</button>
    <span class="title" id="vname"></span>
    <span id="vmeta"></span>
    <button id="vlines">#</button>
    <button id="vwrap">wrap</button>
    <span class="fs"><button id="vfsdown">−</button><span id="vfsnow"></span><button id="vfsup">+</button></span>
  </div>
  <div id="vbody"><div class="code"><pre id="gutter"></pre><pre id="text"></pre></div></div>
</div>
</div>

<div id="scroll">
  <a id="vraw" target="_blank" rel="noopener" title="open this file in a new tab" hidden>
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9.5 2.5h4v4"/>
      <path d="M13.5 2.5 8 8"/>
      <path d="M12 9.5V13H3V4h3.5"/>
    </svg>
  </a>
  <button id="top" title="scroll to top">⤒</button>
  <button id="pgup" title="page up">⇞</button>
  <button id="pgdn" title="page down">⇟</button>
  <button id="bottom" title="scroll to bottom">⤓</button>
  <span id="version">web:{{version}}<span id="sv"></span></span>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const treeEl = $("tree"), spacer = $("spacer"), rootEl = $("root"), dotEl = $("dot");
  const viewer = $("viewer"), vname = $("vname"), vmeta = $("vmeta"), vbody = $("vbody");
  const panes = $("panes");
  const gutter = $("gutter"), text = $("text"), hues = $("hues");

  let ws, previewLimit = null, retry = 500, alive = null, pending = null;
  let anyExpanded = false, showHidden = true, openPath = null, shownPath = null;
  let rootPath = "";
  // Kept alongside the rendered rows so a cursor move can touch two elements
  // instead of rebuilding thousands.
  let rows = [], rowEls = {}, selIdx = null, viewIdx = null;

  const store = {
    get: (k, fallback) => { try { return localStorage.getItem(k) ?? fallback; } catch { return fallback; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
  };

  const bytes = (n) =>
    n < 1024 ? `${n} B`
    : n < 1024 ** 2 ? `${(n / 1024).toFixed(1)} KB`
    : `${(n / 1024 ** 2).toFixed(1)} MB`;

  // -- font size --------------------------------------------------------
  const FS_MIN = 6, FS_MAX = 32, FS_STEP = 0.5;
  // The default lives in the stylesheet's `--fs`, so the page is not one size
  // before the script runs and another after.
  const FS_DEFAULT =
    parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs")) || 10;
  let fs = Number(store.get("fs", FS_DEFAULT));
  if (!(fs >= FS_MIN && fs <= FS_MAX)) fs = FS_DEFAULT;

  function applyFontSize() {
    document.documentElement.style.setProperty("--fs", `${fs}px`);
    // 10 rather than 10.0, but 10.5 stays 10.5.
    const shown = String(Number(fs.toFixed(1)));
    $("fsnow").textContent = shown;
    $("vfsnow").textContent = shown;
    store.set("fs", fs);
  }
  const nudgeFont = (steps) => {
    fs = Math.min(FS_MAX, Math.max(FS_MIN, fs + steps * FS_STEP));
    applyFontSize();
    // Row height is derived from the font size, so the whole window moves.
    if (rows.length) {
      measureRowHeight();
      spacer.style.height = `${rows.length * rowHeight}px`;
      paint(true);
    }
    // So is the height of a line of the file, and the shared line is in lines.
    if (!viewer.hidden) {
      measureLines();
      applyLine(true);
    }
  };

  // -- scrolling --------------------------------------------------------
  const scroller = () => (viewer.hidden ? treeEl : vbody);
  $("top").onclick = () => { scroller().scrollTop = 0; };
  $("bottom").onclick = () => { const el = scroller(); el.scrollTop = el.scrollHeight; };
  // A little short of a full screen, so one line carries over as a landmark.
  const page = (dir) => {
    const el = scroller();
    el.scrollTop = Math.max(0, el.scrollTop + dir * el.clientHeight * 0.9);
  };
  $("pgup").onclick = () => page(-1);
  $("pgdn").onclick = () => page(1);

  // -- connection -------------------------------------------------------
  /// Raw deflate, undone by the browser itself — no library, no polyfill.
  async function inflate(buffer) {
    const stream = new Blob([buffer]).stream()
      .pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text();
  }

  // The server speaks at least every 10s, so silence means the socket is dead
  // even while the browser still calls it open — which is what a slept laptop
  // or a dropped tunnel leaves behind, with no close event ever arriving.
  const SILENCE = 25000;

  // The guard drops news from a socket already given up on: without it a late
  // close would disarm the live socket's timer or queue a second reconnect.
  function heard(socket) {
    if (socket !== ws) return;
    clearTimeout(alive);
    alive = setTimeout(() => lost(socket), SILENCE);
  }

  /// Gives up on a connection and lines up the next one.
  function lost(socket) {
    if (socket !== ws) return;
    ws = null;
    clearTimeout(alive);
    dotEl.classList.remove("on");
    // Not waiting for the close handshake: the peer that went quiet is exactly
    // the one that will never answer it.
    socket.close();
    // Back off so a stopped treex does not spin the tab's radio flat, but not
    // so far that a rebuild finishes and the page sits there anyway.
    clearTimeout(pending);
    pending = setTimeout(connect, retry);
    retry = Math.min(retry * 2, 5000);
  }

  // Returning to the tab, or to the network, is when a wait is most visible.
  // Neither is worth sitting out the rest of the backoff for.
  function wake() {
    if (document.hidden || ws) return;
    clearTimeout(pending);
    retry = 500;
    connect();
  }
  document.addEventListener("visibilitychange", wake);
  window.addEventListener("online", wake);

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${proto}//${location.host}/ws`);
    ws = socket;
    // Large snapshots arrive deflated in a binary frame; small ones as text.
    socket.binaryType = "arraybuffer";
    socket.onopen = () => { dotEl.classList.add("on"); retry = 500; heard(socket); };
    socket.onclose = () => lost(socket);
    socket.onerror = () => lost(socket);
    socket.onmessage = async (e) => {
      heard(socket);
      const text = typeof e.data === "string" ? e.data : await inflate(e.data);
      const msg = JSON.parse(text);
      if (msg.type === "snapshot") render(msg);
      else if (msg.type === "cursor") moveCursor(msg.selected, msg.viewing, msg.viewLine);
    };
  }

  function send(cmd) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(cmd));
  }

  // -- file viewer ------------------------------------------------------
  let lineNumbers = store.get("lines", "1") === "1";
  let aside = store.get("aside", "0") === "1";

  /// The tree is a pane beside the file, not underneath it — except when the
  /// file is folded away, or there is no file.
  function layout() {
    const split = !viewer.hidden;
    // Only when it actually moves: a cursor step from one file to the next
    // changes nothing here, and rebuilding the rows for it would undo the
    // whole point of the cursor message.
    if (panes.classList.contains("split") === split &&
        panes.classList.contains("aside") === aside) return;
    panes.classList.toggle("split", split);
    panes.classList.toggle("aside", aside);
    $("vside").textContent = aside ? "»" : "«";
    // A tree that was `display: none` rendered no rows at all — narrow
    // windows hide it whenever a file is up — so it is built again on its way
    // back rather than coming back empty.
    measureRowHeight();
    paint(true);
  }

  /// Says the file is what is being worked on. The cursor parts company with
  /// the file only over a directory, which has nothing of its own to show —
  /// touching the file puts the cursor back on it.
  function useFile() {
    if (openPath) send({ type: "view", path: openPath });
  }

  // Which line is at the top is shared state, the same way which file is open
  // is: the terminal and every tab follow each other. Each side clamps to its
  // own height, so a tall browser and a short terminal meet at whatever the
  // shorter one can show — and only a scroll a person made is ever sent, so
  // being clamped never drags the other side back.
  //
  // Wrapped text is left out of it. A wrapped line is several screen rows, so
  // there is no line the top of the viewport corresponds to, and following an
  // approximate one would put the other view on the wrong part of the file.
  let lineHeight = 0, codePad = 0, sharedLine = 0, appliedLine = null, scrollTimer = null;
  const SCROLL_THROTTLE = 100;

  const canSync = () => !viewer.hidden && !vbody.className.includes("wrap") && lineHeight > 0;

  function measureLines() {
    const lines = lineCount(text.textContent);
    codePad = parseFloat(getComputedStyle(text).paddingTop) || 0;
    const height = text.scrollHeight - codePad * 2;
    lineHeight = lines > 0 && height > 0 ? height / lines : 0;
    // Same fallback as the tree's row height: environments with no layout
    // report zero, and the stylesheet's own 1.4 is the number they would have
    // produced.
    if (!lineHeight) lineHeight = fs * 1.4;
  }

  const topLine = () =>
    Math.round(Math.max(0, vbody.scrollTop - codePad) / lineHeight);

  /// Puts the shared line at the top, as far as this window can.
  function applyLine(force) {
    if (!canSync()) return;
    if (force || topLine() !== sharedLine) {
      vbody.scrollTop = sharedLine === 0 ? 0 : codePad + sharedLine * lineHeight;
    }
    // What the window actually did with it, which is not always what was
    // asked: a line past the end lands short. Recording the asked-for line
    // here would make that landing look like a scroll of our own, and we
    // would report it back and drag the other side up to meet us.
    appliedLine = topLine();
  }

  function seeLine(line) {
    sharedLine = line ?? 0;
    applyLine(false);
  }

  /// A scroll the person did, as opposed to one `applyLine` just made.
  function onViewerScroll() {
    if (!canSync() || topLine() === appliedLine) return;
    if (scrollTimer) return;
    scrollTimer = setTimeout(() => {
      scrollTimer = null;
      if (!canSync()) return;
      const line = topLine();
      if (line === appliedLine) return;
      appliedLine = line;
      sharedLine = line;
      send({ type: "scrollView", line });
    }, SCROLL_THROTTLE);
  }

  vbody.addEventListener("scroll", onViewerScroll, { passive: true });

  // Flipping between two files should not re-fetch either of them. Entries go
  // stale rather than being invalidated: nothing on the wire says a file's
  // contents changed — the tree only reshapes when a listing does — so a short
  // life is what keeps this honest against an editor running alongside.
  // The TTL is only a memory bound. Correctness comes from the stamp: every
  // request carries the size and mtime we hold, and the server answers
  // `unchanged` or sends the file, so a stale entry cannot survive a look.
  const CACHE_TTL = 5 * 60_000, CACHE_MAX = 24;
  const cache = new Map();

  function cached(path) {
    const hit = cache.get(path);
    if (!hit) return null;
    if (Date.now() - hit.at > CACHE_TTL) {
      cache.delete(path);
      return null;
    }
    // Re-insert so the map stays in least-recently-used order.
    cache.delete(path);
    cache.set(path, hit);
    return hit.res;
  }

  function remember(path, res) {
    cache.set(path, { at: Date.now(), res });
    while (cache.size > CACHE_MAX) cache.delete(cache.keys().next().value);
  }

  const stampOf = (res) =>
    res && res.status === "ok" ? { size: res.size, mtime: res.mtime } : null;

  /// A file ending in a newline does not have one more line than it looks.
  function lineCount(content) {
    if (!content) return 0;
    return content.split("\n").length - (content.endsWith("\n") ? 1 : 0);
  }

  // -- coloring ---------------------------------------------------------
  //
  // The server sends the file once and, beside it, `paint`: a palette and a
  // list of `[length in UTF-16 units, style]` runs covering it end to end.
  // Every number is coerced before it reaches CSS, and every slice of the file
  // is escaped before it reaches HTML.
  const escapes = { "&": "&amp;", "<": "&lt;", ">": "&gt;" };
  const esc = (s) => s.replace(/[&<>]/g, (c) => escapes[c]);
  const int = (n) => Math.min(255, Math.max(0, Number(n) | 0));

  /// `bat` colors for a terminal whose background already matches its theme.
  /// The page has no such background — a dark theme on a light page is white
  /// text on white — so it takes one from the palette: the color covering the
  /// most characters is the file's ordinary text, and everything follows from
  /// whether that is light or dark.
  function backdrop(hue) {
    const covered = new Map();
    for (const [length, style] of hue.runs) {
      covered.set(style, (covered.get(style) ?? 0) + length);
    }
    const ranked = [...covered].sort((a, b) => b[1] - a[1]);
    const ink = ranked.map(([style]) => hue.styles[style]?.c).find(Boolean);
    if (!ink) return null;

    const [r, g, b] = ink.slice(0, 3).map(int);
    const light = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.5;
    return { bg: light ? "#1e2024" : "#fcfcfc", fg: `rgb(${r} ${g} ${b})` };
  }

  /// Puts the file pane back to no coloring at all. Four places need it —
  /// closing, the cursor leaving, a notice replacing the file, and drawing an
  /// uncolored one — and a backdrop left behind by one of them is a dark panel
  /// under plain text.
  function unpaint() {
    hues.textContent = "";
    vbody.classList.remove("painted");
    vbody.style.background = "";
    vbody.style.color = "";
  }

  function hueRules(styles) {
    return styles.map((style, i) => {
      const bits = [];
      if (style.c) bits.push(`color:rgb(${style.c.slice(0, 3).map(int).join(" ")})`);
      if (style.b) bits.push("font-weight:700");
      if (style.i) bits.push("font-style:italic");
      if (style.u) bits.push("text-decoration:underline");
      if (style.d) bits.push("opacity:.7");
      return bits.length ? `#text .h${i}{${bits.join(";")}}` : "";
    }).join("");
  }

  /// Colored when the server had something to say, plain text otherwise —
  /// which is what a machine with no `bat` and `--no-highlight` both produce.
  /// Not to be confused with `paint()` below, which draws tree rows.
  function showText(content, hue) {
    if (!hue || !hue.runs.length) {
      unpaint();
      text.textContent = content;
      return;
    }
    const paper = backdrop(hue);
    vbody.classList.toggle("painted", paper !== null);
    vbody.style.background = paper ? paper.bg : "";
    // Anything the runs do not cover is the file's ordinary text too.
    vbody.style.color = paper ? paper.fg : "";
    hues.textContent = hueRules(hue.styles);

    let html = "", at = 0;
    for (const [length, style] of hue.runs) {
      const chunk = esc(content.slice(at, at + length));
      at += length;
      // The plain style is index 0 and needs no element of its own.
      html += style ? `<span class="h${style}">${chunk}</span>` : chunk;
    }
    // Anything past the last run, which a mismatched pair would leave behind.
    if (at < content.length) html += esc(content.slice(at));
    text.innerHTML = html;
  }

  function paintGutter(lines) {
    gutter.hidden = !lineNumbers;
    $("vlines").className = lineNumbers ? "on" : "";
    if (lineNumbers) {
      gutter.textContent = Array.from({ length: lines }, (_, i) => i + 1).join("\n");
    } else {
      gutter.textContent = "";
    }
  }

  function notice(msg) {
    // A notice is not a painted file, so the last one's backdrop goes with it.
    unpaint();
    vbody.replaceChildren(Object.assign(document.createElement("div"),
      { className: "notice", textContent: msg }));
  }

  function code() {
    // notice() replaced the children; put the two panes back.
    if (!vbody.children.length || vbody.children[0].className !== "code") {
      const wrapper = document.createElement("div");
      wrapper.className = "code";
      wrapper.appendChild(gutter);
      wrapper.appendChild(text);
      vbody.replaceChildren(wrapper);
    }
  }

  /// The same file under its own URL, which is what the new-tab link points at.
  function rawUrl(path) {
    if (!rootPath || !path.startsWith(rootPath)) return null;
    const rel = path.slice(rootPath.length);
    // Per segment: encodeURI leaves # and ? alone, and a file may contain them.
    return "/f/" + rel.split("/").filter(Boolean).map(encodeURIComponent).join("/");
  }

  async function show(row) {
    if (previewLimit === null) return;
    openPath = row.path;
    vname.textContent = row.name;
    const raw = rawUrl(row.path);
    $("vraw").href = raw ?? "#";
    $("vraw").hidden = raw === null;
    vmeta.textContent = "";
    viewer.hidden = false;
    layout();
    if (!cached(row.path)) notice("loading…");

    // Show what we have straight away, then check it is still true. A file
    // that has not changed costs twenty bytes to confirm.
    const held = cached(row.path);
    if (held) draw(held);

    let res;
    try {
      res = await fetch("/rpc", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ method: "preview", path: row.path, known: stampOf(held) }),
      }).then((r) => r.json());
    } catch {
      res = held ?? { status: "unreadable", reason: "could not reach treex" };
    }
    if (openPath !== row.path) return; // a faster click won

    if (res.status === "unchanged") return;
    remember(row.path, res);

    draw(res);
  }

  function draw(res) {
    if (res.status === "ok") {
      vmeta.textContent = bytes(res.size) + (res.lossy ? " · not UTF-8" : "");
      showText(res.content, res.paint);
      code();
      paintGutter(lineCount(res.content));
      measureLines();
    } else if (res.status === "tooLarge") {
      vmeta.textContent = bytes(res.size);
      notice(`${bytes(res.size)} is over the ${bytes(res.limit)} preview limit.\n` +
             `Raise it with --max-preview-size.`);
    } else if (res.status === "binary") {
      vmeta.textContent = bytes(res.size);
      notice("binary file");
    } else {
      notice(res.reason ?? "could not read this file");
    }
    // Not always the top: a page that loaded while the terminal was halfway
    // down a file opens where the terminal is.
    appliedLine = null;
    applyLine(true);
  }

  function close() {
    viewer.hidden = true;
    layout();
    $("vraw").hidden = true;
    openPath = null;
    // What the pane is showing is now nothing, and saying so is what lets the
    // same file be opened again: closing and reopening inside one server tick
    // arrives as a single message, and `syncViewer` would take it for the file
    // it is already showing.
    shownPath = null;
    text.textContent = "";
    unpaint();
    gutter.textContent = "";
    send({ type: "view", path: null });
  }

  // -- tree -------------------------------------------------------------
  //
  // Only the rows on screen exist as elements. A tree of a hundred thousand
  // entries is a hundred thousand `<div>`s otherwise, and the browser will not
  // survive building them however patiently they are fed to it.

  // Rows arrive as [depth, name, packed] with an optional omitted count, where
  // packed is `kind << 3 | ignored << 2 | symlink << 1 | expanded`. The path
  // is never sent:
  // depth-first order means every ancestor is the last row seen at each smaller
  // depth, so it costs one array to rebuild.
  const KINDS = ["d", "f", "s", "p", "c", "b", "!"];
  const SUFFIX = { d: "/", s: "=", p: "|", "!": "@" };

  function decode(raw, root) {
    const base = root === "/" ? "" : root;
    const ancestry = [];
    return raw.map(([depth, name, packed, omitted]) => {
      ancestry[depth] = name;
      const kind = KINDS[packed >> 3] ?? "f";
      return {
        depth,
        name,
        kind,
        path: depth === 0 ? root : `${base}/${ancestry.slice(1, depth + 1).join("/")}`,
        isDir: kind === "d",
        expanded: (packed & 1) !== 0,
        symlink: (packed & 2) !== 0,
        ignored: (packed & 4) !== 0,
        omitted: omitted ?? 0,
      };
    });
  }

  const OVERSCAN = 12;
  let rowHeight = 0, windowStart = -1, windowEnd = -1;

  function measureRowHeight() {
    const probe = document.createElement("div");
    probe.className = "row";
    probe.style.visibility = "hidden";
    probe.textContent = "M";
    spacer.appendChild(probe);
    rowHeight = probe.offsetHeight || 0;
    probe.remove();
    // jsdom-less environments and the very first paint report zero; 2.2em at
    // the current font size is the same number the stylesheet would produce.
    if (!rowHeight) rowHeight = Math.round(fs * 2.2);
  }

  function buildRow(row, i) {
    const el = document.createElement("div");
    el.className = `row kind-${row.kind === "!" ? "broken" : row.kind}`
                 + (row.symlink ? " link" : "") + (row.ignored ? " ignored" : "")
                 + (i === selIdx ? " sel" : "") + (i === viewIdx ? " viewing" : "");
    el.style.top = `${i * rowHeight}px`;

    if (row.depth > 0) {
      const g = document.createElement("span");
      g.className = "guide";
      g.textContent = "│ ".repeat(row.depth);
      el.appendChild(g);
    }
    const tw = document.createElement("span");
    tw.className = "tw";
    tw.textContent = row.isDir ? (row.expanded ? "▾" : "▸") : "";
    el.appendChild(tw);

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = row.name + (SUFFIX[row.kind] ?? "");
    el.appendChild(name);

    if (row.omitted) {
      const more = document.createElement("span");
      more.className = "omitted";
      more.textContent = `… ${row.omitted.toLocaleString()} more`;
      el.appendChild(more);
    }

    // A click in the browser goes straight to reading the file — there is
    // no separate "merely selected" step here, only in the terminal.
    el.onclick = () =>
      send(row.isDir
        ? { type: "toggle", path: row.path }
        : { type: "view", path: row.path });
    return el;
  }

  /// Renders the slice of rows the viewport covers, if it is not already there.
  function paint(force) {
    if (!rowHeight) measureRowHeight();
    const height = treeEl.clientHeight || 600;
    const first = Math.max(0, Math.floor(treeEl.scrollTop / rowHeight) - OVERSCAN);
    const last = Math.min(rows.length, Math.ceil((treeEl.scrollTop + height) / rowHeight) + OVERSCAN);
    if (!force && first === windowStart && last === windowEnd) return;

    windowStart = first;
    windowEnd = last;
    rowEls = {};
    const frag = document.createDocumentFragment();
    for (let i = first; i < last; i++) {
      const el = buildRow(rows[i], i);
      rowEls[i] = el;
      frag.appendChild(el);
    }
    spacer.replaceChildren(frag);
  }

  /// Follows whatever the session says is open, wherever it was opened from:
  /// this tab, another tab, or Enter in the terminal.
  function syncViewer() {
    const open = viewIdx === null || viewIdx === undefined ? null : rows[viewIdx];
    const path = open ? open.path : null;
    if (path === shownPath) return;
    shownPath = path;
    if (path === null) {
      viewer.hidden = true;
      layout();
      $("vraw").hidden = true;
      openPath = null;
      text.textContent = "";
      unpaint();
      gutter.textContent = "";
    } else {
      show(open);
    }
  }

  /// Brings a row into view even when it is not currently rendered.
  function reveal(i) {
    if (i === null || i === undefined || !rowHeight) return;
    const top = i * rowHeight;
    const height = treeEl.clientHeight || 600;
    if (top < treeEl.scrollTop) treeEl.scrollTop = top;
    else if (top + rowHeight > treeEl.scrollTop + height) {
      treeEl.scrollTop = top + rowHeight - height;
    }
  }

  function moveCursor(selected, viewing, viewLine) {
    for (const [i, cls] of [[selIdx, "sel"], [viewIdx, "viewing"]]) {
      if (rowEls[i]) rowEls[i].classList.remove(cls);
    }
    selIdx = selected ?? null;
    viewIdx = viewing ?? null;
    // The terminal follows its own cursor; the browser should follow it too.
    reveal(selIdx);
    paint(false);
    if (rowEls[selIdx]) rowEls[selIdx].classList.add("sel");
    if (rowEls[viewIdx]) rowEls[viewIdx].classList.add("viewing");
    syncViewer();
    seeLine(viewLine);
  }

  function render(snap) {
    previewLimit = snap.previewLimit ?? null;
    // The half of the label the page cannot know: a reconnect can land on a
    // server that was rebuilt, leaving the script it served from behind.
    $("sv").textContent = snap.version ? ` / sv:${snap.version}` : "";
    rootPath = snap.root;
    // U+202A .. U+202C: one left-to-right run inside the right-to-left box.
    rootEl.textContent = `\u202A${snap.root}\u202C`;
    rootEl.title = snap.root;

    anyExpanded = snap.rows.some(([depth, , packed]) => depth > 0 && (packed & 1));
    $("fold").textContent = anyExpanded ? "collapse" : "expand";
    showHidden = snap.showHidden;
    // The button is a filter: lit means the filter is engaged, i.e. dotfiles
    // are being hidden. Everything is shown by default, so it starts unlit.
    $("hidden").className = showHidden ? "" : "on";

    rows = decode(snap.rows, snap.root);
    selIdx = snap.selected ?? null;
    viewIdx = snap.viewing ?? null;

    measureRowHeight();
    spacer.style.height = `${rows.length * rowHeight}px`;
    paint(true);
    syncViewer();
    seeLine(snap.viewLine);
  }

  treeEl.addEventListener("scroll", () => paint(false), { passive: true });

  $("fold").onclick = () =>
    send(anyExpanded ? { type: "collapseAll" } : { type: "expandDepth", depth: 2 });
  $("hidden").onclick = () => send({ type: "setHidden", show: !showHidden });
  $("vclose").onclick = close;
  $("vwrap").onclick = () => {
    vbody.classList.toggle("wrap");
    const wrapping = vbody.classList.contains("wrap");
    $("vwrap").className = wrapping ? "on" : "";
    // Line numbers are meaningless against wrapped lines; the button says so.
    $("vlines").disabled = wrapping;
    // Wrapping leaves the scroll sync, since a wrapped line is several rows.
    // Coming back out of it, the shared line is where to land.
    if (!wrapping) {
      measureLines();
      applyLine(true);
    }
  };
  $("vside").onclick = () => {
    aside = !aside;
    store.set("aside", aside ? "1" : "0");
    layout();
    useFile();
  };
  // Anywhere in the file says the same thing: this file is the subject.
  vbody.addEventListener("click", useFile);

  $("vlines").onclick = () => {
    lineNumbers = !lineNumbers;
    store.set("lines", lineNumbers ? "1" : "0");
    paintGutter(lineCount(text.textContent));
  };
  $("fsdown").onclick = $("vfsdown").onclick = () => nudgeFont(-1);
  $("fsup").onclick = $("vfsup").onclick = () => nudgeFont(1);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

  applyFontSize();
  paintGutter(0);
  connect();
})();
</script>
</body>
</html>
