[package]
name = "treex"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "An interactive directory tree for the terminal — and the same tree in your browser, live-synced."
repository = "https://github.com/up9cloud/treex"
license = "MIT"
keywords = ["tree", "tui", "filesystem", "ratatui", "explorer"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/.github", "/.claude", "/tool", "/Makefile", "/CONTRIBUTING.md", "/assets/samples"]

[features]
default = ["tui", "watch", "web"]
tui = ["dep:ratatui", "dep:crossterm", "dep:futures-util"]
web = [
  "dep:tokio-tungstenite",
  "dep:httparse",
  "dep:serde_json",
  "dep:futures-util",
  "dep:flate2",
  "tokio/fs",
  "tokio/io-util",
  "tokio/time",
  "tokio/net",
]
watch = ["dep:notify", "dep:notify-debouncer-full"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
clap = { version = "4", features = ["derive", "env"] }

ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"], optional = true }

# No axum, no hyper: `src/web/http.rs` is a few hundred lines against twenty
# crates under a tool whose job is reading your files.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }
httparse = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
# rust_backend (miniz_oxide) rather than a C zlib: the release job cross-compiles.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
futures-util = { version = "0.3", optional = true }

notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
serde_json = "1"

[[bin]]
name = "treex"
path = "src/main.rs"

[profile.release]
# Measured on this crate: 4.50 MB -> 2.26 MB, no dependency changes.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
